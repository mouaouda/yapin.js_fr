name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like yapin.js to do?
      description: The API you'd like to write. A code sample is ideal.
      render: js
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Workarounds, or how discord.js or yapper.js handle it.
  - type: checkboxes
    id: api
    attributes:
      label: Yapin’ API support
      options:
        - label: Yapin’ already supports this; it's just missing from yapin.js
        - label: I'm willing to open a pull request for this
