# Categories for GitHub's generated release notes, based on PR labels.
changelog:
  exclude:
    labels: [skip changelog]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
