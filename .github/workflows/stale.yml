name: Close unanswered issues

# Only touches issues and PRs labelled "needs info" that the author hasn't replied to.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs info
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue is waiting on more information and hasn't had a reply in two weeks.
            It will close in 7 days unless there's an update. Comment any time to keep it open.
          close-issue-message: >
            Closing because the information we asked for hasn't arrived. If you can still reproduce this,
            comment with the details and we'll reopen it.
          stale-pr-message: >
            This pull request is waiting on changes and hasn't been updated in two weeks.
            It will close in 7 days unless there's an update.
          close-pr-message: >
            Closing for now. Feel free to reopen when you have time to pick it back up.
